name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_call:        # release.yml runs this whole suite before publishing a tag
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  python:
    name: Python · lint · type · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests evaluation
      - run: ruff format --check src tests evaluation
      - run: mypy
      - run: pytest -m "not integration and not e2e" --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: coverage-python, path: coverage.xml }

  contracts:
    name: Solidity · lint · test · coverage · gas
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: contracts/package-lock.json }
      - run: npm ci
      - run: npx solhint "contracts/**/*.sol"
      - run: npx hardhat compile
      - run: REPORT_GAS=true npx hardhat test
      - run: npx hardhat coverage
      - uses: actions/upload-artifact@v4
        with: { name: contracts-coverage, path: contracts/coverage }

  integration:
    name: Python · integration (hardhat + local IPFS backend)
    runs-on: ubuntu-latest
    needs: [python, contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: contracts/package-lock.json }
      - run: pip install -e ".[dev]"
      - run: cd contracts && npm ci && (npx hardhat node > /tmp/hh.log 2>&1 &) && sleep 5
      - run: cd contracts && npx hardhat run scripts/deploy.ts --network localhost
      # what the compose `registrar` service does: the shipped .env enables both Stage-2 models,
      # so their hashes must be ACTIVE in ModelRegistry or Stage 1 rejects on `model_active`.
      - run: cp .env.example .env && verigate-admin register-models --manifest models/MANIFEST.sha256
      # --no-cov: the 80 % gate in pyproject applies to the unit job, which runs the whole suite;
      # an integration-only selection covers ~51 % by construction.
      - run: IPFS_BACKEND=local LLM_ENABLED=false pytest -m integration --no-cov

  portability:
    name: Portability · compose config · image builds · fresh-clone smoke
    runs-on: ubuntu-latest
    needs: [python, contracts]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infra/docker-compose.yml --profile app --profile llm config -q
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f infra/docker-compose.yml --profile app build
      - run: ./scripts/smoke.sh            # up → deploy → publish fixture → verify → assert verdict → down

  dashboard:
    name: Dashboard · lint · type · build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
