name: Security
on:
  pull_request:
  schedule: [{ cron: "0 3 * * 1" }]   # weekly Monday 03:00 UTC
permissions: { contents: read, security-events: write }

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e . pip-audit && pip-audit
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # contracts/ ships only OpenZeppelin; the Hardhat 2 build toolchain carries known transitive
      # advisories whose only fix is Hardhat 3 (docs/security-audit.md) — audited without devDependencies.
      - run: cd contracts && npm ci && npm audit --omit=dev --audit-level=high
      - run: cd dashboard && npm ci && npm audit --audit-level=high

  slither:
    name: slither (static analysis of contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crytic/slither-action@v0.4.0
        with: { target: contracts/, sarif: slither.sarif, fail-on: medium }
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: slither.sarif }
