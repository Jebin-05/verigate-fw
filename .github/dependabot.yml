version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    groups: { python-minor: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: "/contracts"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
