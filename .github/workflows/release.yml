name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions: { contents: write, packages: write }

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build && python -m build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires a lowercase repository path; github.repository keeps the owner's casing.
      - id: image
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.app
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}/gateway:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.repo }}/gateway:latest
      - name: Verify model manifest
        run: cd models && sha256sum -c MANIFEST.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            models/*.onnx
            models/MANIFEST.sha256
