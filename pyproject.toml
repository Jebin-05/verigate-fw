[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verigate"
version = "0.2.0"
description = "Verifiable AI-gated firmware updates for IoT (blockchain + IPFS)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "web3>=7.0",
  "pynacl>=1.5",
  "httpx>=0.27",
  "multiformats>=0.3",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "onnxruntime>=1.18",
  "skl2onnx>=1.17",
  "onnx>=1.16",
  "shap>=0.46",
  "typer>=0.12",
  "structlog>=24.1",
  "packaging>=24.0",
  "pyyaml>=6.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "types-requests",
  "types-PyYAML",
]
eval = ["matplotlib>=3.9", "jupyter>=1.1", "pyarrow>=17"]

[project.scripts]
verigate-publish = "verigate.publisher.cli:app"
verigate-gateway = "verigate.gateway.api.main:run"
verigate-fleet = "verigate.fleet.cli:app"
verigate-attack = "verigate.attacks.cli:app"
verigate-train = "verigate.ml.train.cli:app"
verigate-admin = "verigate.gateway.admin:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verigate = ["py.typed", "common/abi/*.json", "ml/train/*.tmpl"]

# ---------------- ruff: lint + format (replaces black, isort, flake8) ----------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "S", "T20", "D"]
ignore = ["D100", "D104", "D107", "D203", "D213", "S101"]   # S101: asserts allowed in tests (per-file below)
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D", "ARG"]
"evaluation/**" = ["T20", "D"]
"docs/**" = ["T20", "D", "C408", "E501", "E741"]   # one-off figure generators, not runtime code
"src/verigate/attacks/**" = ["S"]   # attack scripts deliberately do unsafe things in a sandbox
[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["verigate"]
[[tool.mypy.overrides]]
module = ["sklearn.*", "shap.*", "skl2onnx.*", "onnxruntime.*", "multiformats.*", "nacl.*", "scipy.*", "onnx.*"]
ignore_missing_imports = true

# ---------------- coverage ----------------
[tool.coverage.run]
# Attack scenarios are exercised end to end (tests/e2e/test_attack_*.py against a running stack),
# not by the unit suite; the training CLI is exercised by `make train`.
omit = ["src/verigate/attacks/*", "src/verigate/ml/train/cli.py"]

# ---------------- pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs a running hardhat node / IPFS (make infra-up)",
  "e2e: full stack via docker compose",
  "slow: > 5 s",
]
addopts = "-ra --strict-markers --cov=verigate --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error::DeprecationWarning:verigate.*"]
