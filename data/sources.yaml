# Pinned upstream releases used for the benign SBOM corpus (P5-02). Everything here is public
# OpenWrt release metadata: one package manifest per (release, target) listing every shipped
# package with its exact version. `verigate-train data fetch` downloads them into data/raw/,
# `verigate-train data sbom` converts them to CycloneDX under data/processed/, and
# data/MANIFEST.sha256 records every file so the corpus is reproducible without committing it.
#
# ESPHome and Tasmota (mentioned in the Project Guide) ship monolithic ESP images without a
# package manifest and syft cannot catalogue them, so they are not part of this corpus; the
# model card states this.
openwrt:
  base_url: https://downloads.openwrt.org/releases
  releases:
    - 19.07.0
    - 19.07.1
    - 19.07.2
