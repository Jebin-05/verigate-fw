name: Security
on:
  pull_request:
  workflow_dispatch:                  # so it can be run on demand before a release
  schedule: [{ cron: "0 3 * * 1" }]   # weekly Monday 03:00 UTC
# pull-requests: write — gitleaks-action writes its result back to the PR; without it the
# job dies with "Resource not accessible by integration" on every pull request.
permissions: { contents: read, security-events: write, pull-requests: write }

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    # Dependabot PRs get a read-only token, and the action needs to write its summary.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # the runner's bundled setuptools/pip carry their own advisories; audit the project, not the bootstrap
      - run: pip install -U pip setuptools wheel && pip install -e . pip-audit && pip-audit
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # contracts/ ships only OpenZeppelin; the Hardhat 2 build toolchain carries known transitive
      # advisories whose only fix is Hardhat 3 (docs/security-audit.md) — audited without devDependencies.
      - run: cd contracts && npm ci && npm audit --omit=dev --audit-level=high
      - run: cd dashboard && npm ci && npm audit --audit-level=high

  slither:
    name: slither (static analysis of contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crytic/slither-action@v0.4.0
        with: { target: contracts/, sarif: slither.sarif, fail-on: medium }
      # Code scanning needs GitHub Advanced Security on a private repository; the gate is
      # slither's own `fail-on: medium` above, the upload is only for the Security tab.
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with: { sarif_file: slither.sarif }
